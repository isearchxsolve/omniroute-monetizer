service_tier = "default"

notify = [ "C:\\Users\\Admin\\AppData\\Local\\OpenAI\\Codex\\runtimes\\cua_node\\84464046935436b8\\bin\\node_modules\\@oai\\sky\\bin\\windows\\codex-computer-use.exe", "turn-ended" ]

# --- omniroute gateway ---
# Codex Desktop reads top-level model + model_provider.
# This table sits after top-level keys (before [tui] / [desktop]).
[model_providers.omniroute]
name                      = "OmniRoute"
base_url                  = "http://127.0.0.1:20128/v1"
experimental_bearer_token = "REPLACE_WITH_OMNIROUTE_KEY"
requires_openai_auth      = false
wire_api                  = "responses"
# --- end omniroute gateway ---

[tui]
stream_reasoning_live = true
approval_policy = "never"
sandbox_mode = "workspace-write"

