<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice Chat — TokenRouter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: #101418; color: #e6e6e6;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; background: #161c22; border-bottom: 1px solid #2a333d;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { font-size: 12px; color: #8b98a5; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1f6feb33; border: 1px solid #1f6feb66; }
  .bot  { align-self: flex-start; background: #1c242c; border: 1px solid #2a333d; }
  .err  { align-self: center; background: #3d1518; border: 1px solid #7f2d33; color: #ffb4b9; font-size: 13px; }
  footer {
    padding: 16px 20px; background: #161c22; border-top: 1px solid #2a333d;
    display: flex; gap: 10px; align-items: center;
  }
  #mic {
    width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
    background: #1f6feb; color: #fff; font-size: 24px; flex-shrink: 0;
    transition: background .15s, transform .15s;
  }
  #mic.listening { background: #d1242f; animation: pulse 1.2s infinite; }
  #mic:disabled { background: #3a444f; cursor: not-allowed; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #input {
    flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #2a333d;
    background: #0d1117; color: #e6e6e6; font-size: 15px; outline: none;
  }
  #input:focus { border-color: #1f6feb; }
  #send {
    padding: 14px 22px; border-radius: 10px; border: none; cursor: pointer;
    background: #238636; color: #fff; font-size: 15px;
  }
  label.voice-out { font-size: 12px; color: #8b98a5; display: flex; gap: 6px; align-items: center; user-select: none; }
</style>
</head>
<body>
<header>
  <h1>🎙️ Voice Chat</h1>
  <span id="status">qwen/qwen3.8-max-free via TokenRouter</span>
</header>
<div id="chat"></div>
<footer>
  <button id="mic" title="Hold to talk (or click to toggle)">🎤</button>
  <input id="input" placeholder="Type, or press the mic and speak…" autocomplete="off">
  <button id="send">Send</button>
  <label class="voice-out"><input type="checkbox" id="speak" checked> speak replies</label>
</footer>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const mic = document.getElementById("mic");
const sendBtn = document.getElementById("send");
const speakBox = document.getElementById("speak");
const status = document.getElementById("status");

const history = [
  { role: "system", content: "You are a helpful voice assistant. Keep answers short and conversational, suitable for being read aloud." }
];

function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speak(text) {
  if (!speakBox.checked || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

async function send(text) {
  if (!text.trim()) return;
  input.value = "";
  addMsg(text, "user");
  history.push({ role: "user", content: text });
  status.textContent = "thinking…";
  sendBtn.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    if (data.ok) {
      history.push({ role: "assistant", content: data.text });
      addMsg(data.text, "bot");
      speak(data.text);
      status.textContent = "qwen/qwen3.8-max-free via TokenRouter";
    } else {
      addMsg("Error: " + (data.error || "unknown"), "err");
      status.textContent = "error";
    }
  } catch (e) {
    addMsg("Error: " + e.message + " — is server.py running?", "err");
    status.textContent = "error";
  }
  sendBtn.disabled = false;
}

sendBtn.onclick = () => send(input.value);
input.addEventListener("keydown", e => { if (e.key === "Enter") send(input.value); });

// ---- speech recognition ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR) {
  rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "";
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t; else interim += t;
    }
    input.value = finalText + interim;
  };
  rec.onend = () => {
    listening = false;
    mic.classList.remove("listening");
    if (finalText.trim()) send(finalText.trim());
    finalText = "";
  };
  rec.onerror = e => {
    status.textContent = "mic error: " + e.error;
    listening = false;
    mic.classList.remove("listening");
  };
  mic.onclick = () => {
    if (listening) { rec.stop(); return; }
    speechSynthesis && speechSynthesis.cancel();
    finalText = "";
    listening = true;
    mic.classList.add("listening");
    status.textContent = "listening…";
    rec.start();
  };
} else {
  mic.disabled = true;
  mic.title = "Speech recognition not supported in this browser — use Chrome or Edge";
  status.textContent = "mic unavailable in this browser";
}
</script>
</body>
</html>
